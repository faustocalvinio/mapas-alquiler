<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idealista to Mapas Alquiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
        }

        .container {
            background: white;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .small-text {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: block;
        }

        .apartment-preview {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .apartment-preview.show {
            display: block;
        }

        .apartment-preview h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .preview-item {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .preview-label {
            font-weight: 600;
            color: #555;
        }

        .preview-value {
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Mapas Alquiler</h1>
            <p class="subtitle">Extractor de Idealista</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-button active" data-tab="extract">Extraer</button>
            <button class="tab-button" data-tab="config">Configuración</button>
        </div>

        <!-- Tab: Extract -->
        <div class="tab-content active" id="extract-tab">
            <div id="status" class="status"></div>

            <div id="apartment-preview" class="apartment-preview">
                <h3>📋 Vista previa:</h3>
                <div id="preview-content"></div>
            </div>

            <button id="extract-btn" class="btn-primary">
                📥 Extraer datos de esta página
            </button>

            <button id="save-btn" class="btn-primary hidden" disabled>
                💾 Guardar apartamento
            </button>
        </div>

        <!-- Tab: Config -->
        <div class="tab-content" id="config-tab">
            <div class="config-section">
                <div class="form-group">
                    <label for="api-url">URL de la API:</label>
                    <input type="url" id="api-url" placeholder="https://mapa.facal.space">
                    <p class="small-text">
                        Producción: https://mapa.facal.space<br>
                        Desarrollo: http://localhost:3000
                    </p>
                </div>

                <div class="form-group">
                    <label for="api-key">API Key:</label>
                    <input type="text" id="api-key" placeholder="Tu email en base64">
                    <p class="small-text">Obtén tu API key desde /api-key en tu aplicación</p>
                </div>

                <button id="save-config" class="btn-primary">Guardar configuración</button>
                <button id="test-connection" class="btn-secondary">Probar conexión</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
