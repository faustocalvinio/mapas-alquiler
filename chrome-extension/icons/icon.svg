<!-- icon.svg - Ícono base SVG que se puede convertir a PNG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="128" height="128" rx="24" fill="url(#grad1)"/>
  
  <!-- Icono de casa -->
  <g transform="translate(24, 32)">
    <!-- Techo -->
    <path d="M 40 10 L 10 35 L 15 35 L 15 65 L 65 65 L 65 35 L 70 35 Z" 
          fill="white" 
          stroke="white" 
          stroke-width="2"/>
    
    <!-- Chimenea -->
    <rect x="50" y="20" width="8" height="12" fill="white"/>
    
    <!-- Puerta -->
    <rect x="32" y="45" width="16" height="20" fill="#667eea" rx="2"/>
    
    <!-- Ventana izquierda -->
    <rect x="20" y="42" width="8" height="8" fill="#667eea" rx="1"/>
    
    <!-- Ventana derecha -->
    <rect x="52" y="42" width="8" height="8" fill="#667eea" rx="1"/>
  </g>
  
  <!-- Símbolo + en la esquina -->
  <circle cx="100" cy="100" r="16" fill="white"/>
  <path d="M 100 92 L 100 108 M 92 100 L 108 100" 
        stroke="#667eea" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>
